[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antibiotic-annotation"
version = "0.1.0"
description = "Annotate PDB chemical components as antibacterial antibiotics using ChEBI ontology evidence"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
antibiotic-annotation = "antibiotic_annotation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
